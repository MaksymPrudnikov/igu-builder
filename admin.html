<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IGU Full Database Admin</title>
<style>
:root{--ink:#1f1e1d;--muted:#77746e;--line:#ddd9d0;--bg:#f3f1ec;--panel:#fff;--soft:#f8f7f3;--accent:#e8792e;--ok:#2f6d45;--bad:#9a3f31}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1900px;margin:auto;padding:18px 20px 60px}
.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.ey{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}h1{font-size:23px;margin:2px 0 3px}.sub{font-size:11.5px;color:var(--muted)}
.actions,.toolbar,.tabs,.cards{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.actions{justify-content:flex-end}.btn,.tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;color:var(--ink);text-decoration:none}.btn.primary,.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.warn{color:var(--bad)}
.auth{display:flex;gap:5px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px}.auth input{border:0;outline:0;padding:4px 6px;width:170px}.auth input[type="email"]{width:210px}.auth.ok{border-color:#95c3a3;background:#f4faf6}.auth .state{font-size:10px;color:var(--muted);padding-right:5px}
.cards{margin:14px 0 10px}.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-width:125px}.card span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase}.card b{font:600 16px Consolas,monospace}
.tabs{margin-bottom:10px}.tab{padding:8px 12px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 8px 25px rgba(31,30,29,.04)}.hidden{display:none!important}
.toolbar{margin-bottom:9px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:7px;background:#fff;padding:7px 8px;outline:none}.grow{flex:1;min-width:240px}.count{font-size:11px;color:var(--muted);margin-left:auto}
.sheetwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}.sheet{border-collapse:separate;border-spacing:0;width:100%;min-width:1200px}.sheet th{position:sticky;top:0;z-index:4;background:#f5f3ee;border-bottom:1px solid var(--ink);border-right:1px solid var(--line);font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px;text-align:left}.sheet td{border-bottom:1px solid #ece9e2;border-right:1px solid #eeeae3;padding:0;background:#fff}.sheet tr:hover td{background:#fcfbf8}.sheet input,.sheet select{display:block;width:100%;border:0;background:transparent;padding:6px 7px;outline:0;min-height:31px}.sheet input:focus,.sheet select:focus{box-shadow:inset 0 0 0 2px var(--accent);background:#fff}.rowno{font:10px Consolas,monospace;color:var(--muted);text-align:right;padding:6px!important;background:#faf9f6!important}.selcol{width:32px;text-align:center;padding:5px!important;background:#faf9f6!important}.energy td{background:#fff9f0}
.help{font-size:11px;color:var(--muted);margin-top:8px}.status{display:none;margin:9px 0;padding:7px 10px;border-radius:7px}.status.on{display:block}.status.ok{background:#edf7ef;color:var(--ok)}.status.bad{background:#fff0ed;color:var(--bad)}
#raw{width:100%;height:66vh;border:1px solid var(--line);border-radius:8px;padding:10px;font:11px/1.45 Consolas,monospace}.settingsrow{display:flex;gap:8px;align-items:center;margin-bottom:9px}.settingsrow select{padding:7px;border:1px solid var(--line);border-radius:7px;background:#fff}
body:not(.admin-unlocked) .protected{display:none!important}@media(max-width:900px){.top{flex-direction:column}.actions{justify-content:flex-start}.wrap{padding:12px}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="ey">Full original IGU database</div><h1>Catalog / Admin</h1><div class="sub">All datasets from the original file are preserved here, not only the 340 front-end glass rows.</div></div>
<div class="actions"><a class="btn" href="igu-form.html">← IGU Builder</a><div class="auth" id="authBox"><input id="adminEmail" type="email" autocomplete="username" placeholder="Admin email"><input id="adminKey" type="password" autocomplete="current-password" placeholder="Password"><button id="authBtn" class="btn" style="border:0;padding:5px 8px" onclick="unlock()">Sign in</button><span id="authState" class="state">signed out</span></div><button class="btn protected" onclick="exportDb()">Export JSON</button><label class="btn protected">Import JSON<input id="importFile" type="file" accept=".json,application/json" hidden onchange="importDb(this)"></label><button class="btn warn protected" onclick="resetDb()">Reload cloud</button><button class="btn primary protected" onclick="saveDb()">Save to cloud</button></div></div>
<div class="cards protected"><div class="card"><span>Front-end items</span><b id="cItems">—</b></div><div class="card"><span>Substrates</span><b id="cSub">—</b></div><div class="card"><span>Coatings</span><b id="cCoat">—</b></div><div class="card"><span>Laminated</span><b id="cLam">—</b></div><div class="card"><span>Total rows</span><b id="cTotal">—</b></div></div>
<div id="status" class="status"></div>
<div class="tabs protected" id="tabs"></div>
<section class="panel protected" id="tablePanel"><div class="toolbar"><input id="q" class="grow" placeholder="Search this table…" oninput="renderTable()"><select id="mfr" onchange="renderTable()"><option value="">All manufacturers</option></select><button class="btn" onclick="addRow()">+ Add row</button><button class="btn" onclick="duplicateRows()">Duplicate</button><button class="btn warn" onclick="deleteRows()">Delete</button><button class="btn" onclick="copyRows()">Copy TSV</button><span class="count" id="count"></span></div><div class="sheetwrap"><table class="sheet"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="help" id="help"></div></section>
<section class="panel protected hidden" id="settingsPanel"><div class="settingsrow"><b>Production dataset</b><select id="settingsDataset" onchange="switchSettings(this.value)"></select><button class="btn" onclick="addSetting()">+ Add row</button><button class="btn warn" onclick="deleteSettings()">Delete selected</button><span class="count" id="settingsCount"></span></div><div class="sheetwrap"><table class="sheet" style="min-width:800px"><thead id="shead"></thead><tbody id="sbody"></tbody></table></div></section>
<section class="panel protected hidden" id="rawPanel"><div class="help" style="margin:0 0 8px">Advanced: complete database JSON.</div><textarea id="raw"></textarea><div style="margin-top:8px"><button class="btn" onclick="applyRaw()">Apply raw JSON</button></div></section>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let db=null,current='items',dirty=false,currentSettings='spacerSizes';
const SUPABASE_URL='https://eqayeedrzihmxhznoide.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_v8PrLe6mr1X2VELeerRsQQ_e6GUdLTx';
const cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let cloudVersion=null,cloudUpdatedAt=null,cloudLoaded=false,currentSession=null;
const TABLES={
 items:{label:'Glass catalog',key:'items',fields:[['enabled','Enabled','bool'],['b','Manufacturer','text'],['lbl','Product','text'],['f','Family','text'],['cat','Category','text'],['t','Nominal t mm','numlist'],['ta','Actual map','map'],['srf','Surface','number'],['combo','Combo','bool'],['color','Color','text'],['tvis','Tvis','number']]},
 substrates:{label:'Substrates',key:'substrates',fields:[['n','Name','text'],['b','Manufacturer','text'],['f','Family','text'],['c','Color','text'],['t','Nominal t mm','numlist'],['ta','Actual map','map'],['ids','IGDB IDs','json'],['srf','Surface','number'],['tvis','Tvis','number']]},
 coatings:{label:'Coatings',key:'coatings',fields:[['n','Coating','text'],['b','Manufacturer','text'],['srf','Surface','number'],['sub','Substrates / thickness map','json'],['ids','IGDB IDs','json'],['cnt','Count','number']]},
 laminates:{label:'Laminated glass',key:'laminates',fields:[['id','IGDB ID','number'],['b','Manufacturer','text'],['n','Make-up','text'],['mm','Thickness mm','number'],['coated','Coated','bool'],['side','Coated side','number'],['tvis','Tvis','number']]}
};
const SETTINGS={spacerSizes:['Spacer sizes',[['f','Fraction','text'],['mm','mm','number']]],spacers:['Spacers',[['c','Code','text'],['n','Name','text'],['col','Color','text'],['s','Allowed sizes','list']]],gases:['Gases',null],sealants:['Sealants',null],interlayers:['Interlayers','object'],paints:['Paint colors',[['n','Name','text'],['c','Color','text']]],heatTreatments:['Heat treatments',null],fritPatterns:['Frit patterns',null],fritColors:['Frit colors',null],categories:['Categories','pairs'],constants:['Technical constants','constants']};
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function status(m,t='ok'){let e=document.getElementById('status');e.textContent=m;e.className='status on '+t;clearTimeout(status.t);status.t=setTimeout(()=>e.className='status',4500)}
function mark(){dirty=true;document.title='* IGU Full Database Admin'}
function setAuthUI(session){
  currentSession=session||null;
  const signedIn=!!session;
  document.body.classList.toggle('admin-unlocked',signedIn);
  document.getElementById('authBox').classList.toggle('ok',signedIn);
  document.getElementById('authState').textContent=signedIn?'signed in':'signed out';
  document.getElementById('authBtn').textContent=signedIn?'Sign out':'Sign in';
  if(signedIn){
    document.getElementById('adminEmail').value=session.user?.email||document.getElementById('adminEmail').value;
    document.getElementById('adminKey').value='';
    if(db)renderAll();
  }
}
async function unlock(){
  try{
    if(currentSession){
      const {error}=await cloud.auth.signOut();
      if(error)throw error;
      setAuthUI(null);
      status('Signed out.');
      return;
    }
    const email=document.getElementById('adminEmail').value.trim();
    const password=document.getElementById('adminKey').value;
    if(!email||!password)return status('Enter admin email and password.','bad');
    document.getElementById('authState').textContent='signing in…';
    const {data,error}=await cloud.auth.signInWithPassword({email,password});
    if(error)throw error;
    setAuthUI(data.session);
    status('Admin signed in. Shared database is ready.');
  }catch(e){
    setAuthUI(null);
    status('Sign in failed: '+(e.message||e),'bad');
  }
}
async function loadCloudDb(){
  const {data,error}=await cloud.from('app_data').select('data,version,updated_at').eq('id','catalog').single();
  if(error)throw error;
  if(!data||!data.data)throw new Error('Cloud catalog row not found');
  db=data.data;
  cloudVersion=Number(data.version)||0;
  cloudUpdatedAt=data.updated_at||null;
  cloudLoaded=true;
  return db;
}
function parseNums(v){return String(v||'').split(/[,;]+/).map(x=>+x.trim()).filter(Number.isFinite)}
function parseMap(v){let o={};String(v||'').split(/[,;]+/).forEach(p=>{let q=p.trim().split(':');if(q.length===2&&isFinite(+q[0])&&isFinite(+q[1]))o[String(+q[0])]=+q[1]});return o}
function showMap(o){return Object.entries(o||{}).map(([k,v])=>k+':'+v).join(',')}
function showJson(o){return JSON.stringify(o??{})}
function parseVal(type,v,el){if(type==='bool')return !!el.checked;if(type==='number')return v===''?'':+v;if(type==='numlist')return parseNums(v);if(type==='map')return parseMap(v);if(type==='json'){try{return JSON.parse(v||'{}')}catch(e){throw new Error('Invalid JSON cell')} }return v}
async function load(){
  let cloudError=null;
  try{
    await loadCloudDb();
  }catch(e){
    cloudError=e;
    cloudLoaded=false;
    cloudVersion=null;
    console.warn('Shared database unavailable; loading packaged fallback:',e);
    const r=await fetch('data/db.json',{cache:'no-store'});
    if(!r.ok)throw new Error('Cannot load shared database or data/db.json');
    db=await r.json();
  }
  if(!db.items||!db.items.length||!db.substrates||!db.coatings||!db.laminates)throw new Error('This is not the FULL database package.');
  buildTabs();
  buildSettingsSelect();

  const {data:{session}}=await cloud.auth.getSession();
  setAuthUI(session);
  cloud.auth.onAuthStateChange((_event,nextSession)=>setAuthUI(nextSession));

  if(cloudError)status('Shared database could not be reached. Admin is showing the packaged fallback; saving is disabled until cloud reload succeeds.','bad');
  else status('Shared database loaded. Sign in to edit.');
}
function counts(){let a=db.items?.length||0,b=db.substrates?.length||0,c=db.coatings?.length||0,d=db.laminates?.length||0;document.getElementById('cItems').textContent=a;document.getElementById('cSub').textContent=b;document.getElementById('cCoat').textContent=c;document.getElementById('cLam').textContent=d;document.getElementById('cTotal').textContent=a+b+c+d}
function buildTabs(){document.getElementById('tabs').innerHTML=Object.entries(TABLES).map(([k,v])=>`<button class="tab ${k===current?'on':''}" data-k="${k}" onclick="switchTable('${k}')">${v.label}</button>`).join('')+'<button class="tab" data-k="settings" onclick="showSpecial(\'settings\')">Production settings</button><button class="tab" data-k="raw" onclick="showSpecial(\'raw\')">Raw JSON</button>'}
function switchTable(k){commitSettings();current=k;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.k===k));document.getElementById('tablePanel').classList.remove('hidden');document.getElementById('settingsPanel').classList.add('hidden');document.getElementById('rawPanel').classList.add('hidden');renderTable()}
function showSpecial(k){if(k==='settings'){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.k==='settings'));document.getElementById('tablePanel').classList.add('hidden');document.getElementById('settingsPanel').classList.remove('hidden');document.getElementById('rawPanel').classList.add('hidden');renderSettings()}else{commitSettings();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.k==='raw'));document.getElementById('tablePanel').classList.add('hidden');document.getElementById('settingsPanel').classList.add('hidden');document.getElementById('rawPanel').classList.remove('hidden');document.getElementById('raw').value=JSON.stringify(db,null,2)}}
function renderAll(){counts();renderTable();renderSettings()}
function getRows(){return db[TABLES[current].key]||[]}
function buildMfr(){let s=document.getElementById('mfr'),cur=s.value,vals=[...new Set(getRows().map(x=>x.b).filter(Boolean))].sort();s.innerHTML='<option value="">All manufacturers</option>'+vals.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('')}
function textFor(x){return Object.values(x).map(v=>typeof v==='object'?JSON.stringify(v):String(v)).join(' ').toLowerCase()}
function renderTable(){if(!db)return;let cfg=TABLES[current],rows=getRows(),q=document.getElementById('q').value.toLowerCase().trim(),mf=document.getElementById('mfr').value;buildMfr();let view=rows.map((x,i)=>({x,i})).filter(({x})=>(!q||textFor(x).includes(q))&&(!mf||x.b===mf));document.getElementById('thead').innerHTML='<tr><th class="selcol"></th><th>#</th>'+cfg.fields.map(f=>`<th>${esc(f[1])}</th>`).join('')+'</tr>';document.getElementById('tbody').innerHTML=view.map(({x,i})=>rowHtml(x,i,cfg)).join('');document.getElementById('count').textContent=`${view.length} shown / ${rows.length} total`;document.getElementById('help').textContent=current==='coatings'?'Complex substrate maps and IGDB IDs are editable as JSON in a cell.':'Copy/paste values directly into cells. Complex maps are shown as compact text or JSON.'}
function rowHtml(x,i,cfg){let energy=/energy advantage/i.test(x.lbl||x.n||'')?'energy':'';return `<tr data-i="${i}" class="${energy}"><td class="selcol"><input class="pick" type="checkbox"></td><td class="rowno">${i+1}</td>`+cfg.fields.map(f=>cell(x,i,f)).join('')+'</tr>'}
function cell(x,i,f){let [k,l,t]=f,v=x[k];if(t==='bool')return `<td class="selcol"><input type="checkbox" data-i="${i}" data-k="${k}" data-t="${t}" ${v?'checked':''} onchange="changed(this)"></td>`;let shown=t==='numlist'?(v||[]).join(','):t==='map'?showMap(v):t==='json'?showJson(v):(v??'');return `<td><input type="${t==='number'?'number':'text'}" step="any" data-i="${i}" data-k="${k}" data-t="${t}" value="${esc(shown)}" onchange="changed(this)" oninput="mark()"></td>`}
function changed(el){try{let rows=getRows(),x=rows[+el.dataset.i];x[el.dataset.k]=parseVal(el.dataset.t,el.value,el);mark()}catch(e){status(e.message,'bad')}}
function blank(){let o={};TABLES[current].fields.forEach(([k,l,t])=>o[k]=t==='bool'?false:t==='number'?'':t==='numlist'?[]:t==='map'||t==='json'?{}:'');if(current==='items'){o.enabled=true;o.b='Pilkington';o.lbl='New glass';o.f='Coated';o.cat='lowe';o.t=[6];o.ta={'6':6};o.srf=2;o.combo=false;o.color='#dfe8e6';o.tvis=''}if(current==='substrates'){o.n='New substrate';o.b='Pilkington';o.f='Coated';o.c='#dfe8e6';o.t=[6];o.ta={'6':6};o.ids={};o.srf=2;o.tvis=''}if(current==='coatings'){o.n='New coating';o.b='Pilkington';o.srf=2;o.sub={};o.ids={};o.cnt=0}if(current==='laminates'){o.id='';o.b='Pilkington';o.n='New laminate';o.mm=6;o.coated=false;o.side=0;o.tvis=''}return o}
function picks(){return [...document.querySelectorAll('#tbody tr')].filter(tr=>tr.querySelector('.pick')?.checked).map(tr=>+tr.dataset.i)}
function addRow(){getRows().push(blank());mark();renderTable()}
function duplicateRows(){let p=picks();if(!p.length)return status('Select rows first.','bad');p.forEach(i=>getRows().push(structuredClone(getRows()[i])));mark();renderTable()}
function deleteRows(){let p=new Set(picks());if(!p.size)return status('Select rows first.','bad');db[TABLES[current].key]=getRows().filter((_,i)=>!p.has(i));mark();renderTable();counts()}
async function copyRows(){let p=picks(),cfg=TABLES[current],rows=p.length?p.map(i=>getRows()[i]):getRows();let txt=rows.map(x=>cfg.fields.map(([k,l,t])=>t==='bool'?(x[k]?'TRUE':'FALSE'):t==='numlist'?(x[k]||[]).join(','):t==='map'?showMap(x[k]):t==='json'?showJson(x[k]):x[k]??'').join('\t')).join('\n');await navigator.clipboard.writeText(txt);status(`Copied ${rows.length} row(s).`)}
function buildSettingsSelect(){let s=document.getElementById('settingsDataset');s.innerHTML=Object.entries(SETTINGS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');s.value=currentSettings}
function switchSettings(k){commitSettings();currentSettings=k;renderSettings()}
function settingRows(){let spec=SETTINGS[currentSettings],v=db.settings[currentSettings];if(spec[1]===null)return (v||[]).map(value=>({value}));if(spec[1]==='object')return Object.entries(v||{}).map(([brand,o])=>({brand,th:(o.th||[]).join(','),gr:(o.gr||[]).join(',')}));if(spec[1]==='pairs')return (v||[]).map(a=>({key:a[0],label:a[1]}));if(spec[1]==='constants')return Object.entries(v||{}).map(([key,value])=>({key,value}));return structuredClone(v||[]).map(o=>{if(Array.isArray(o.s))o.s=o.s.join(',');return o})}
function settingCols(){let s=SETTINGS[currentSettings][1];if(s===null)return [['value','Value','text']];if(s==='object')return [['brand','Brand','text'],['th','Thicknesses','list'],['gr','Grades','list']];if(s==='pairs')return [['key','Key','text'],['label','Label','text']];if(s==='constants')return [['key','Key','text'],['value','Value','text']];return s}
function renderSettings(){if(!db)return;let rows=settingRows(),cols=settingCols();document.getElementById('shead').innerHTML='<tr><th class="selcol"></th><th>#</th>'+cols.map(c=>`<th>${c[1]}</th>`).join('')+'</tr>';document.getElementById('sbody').innerHTML=rows.map((r,i)=>`<tr><td class="selcol"><input class="spick" type="checkbox"></td><td class="rowno">${i+1}</td>`+cols.map(c=>`<td><input data-k="${c[0]}" value="${esc(r[c[0]]??'')}" oninput="mark()"></td>`).join('')+'</tr>').join('');document.getElementById('settingsCount').textContent=rows.length+' row(s)'}
function commitSettings(){if(!db||!document.getElementById('sbody'))return;let spec=SETTINGS[currentSettings][1],cols=settingCols(),rows=[...document.querySelectorAll('#sbody tr')].map(tr=>{let o={};tr.querySelectorAll('input[data-k]').forEach(i=>o[i.dataset.k]=i.value);return o});if(spec===null)db.settings[currentSettings]=rows.map(r=>r.value).filter(Boolean);else if(spec==='object'){let o={};rows.forEach(r=>{if(r.brand)o[r.brand]={th:parseNums(r.th),gr:String(r.gr||'').split(',').map(x=>x.trim()).filter(Boolean)}});db.settings[currentSettings]=o}else if(spec==='pairs')db.settings[currentSettings]=rows.filter(r=>r.key).map(r=>[r.key,r.label]);else if(spec==='constants'){let o={};rows.forEach(r=>{if(r.key)o[r.key]=isFinite(+r.value)?+r.value:r.value});db.settings[currentSettings]=o}else db.settings[currentSettings]=rows.map(r=>{cols.forEach(c=>{if(c[2]==='number')r[c[0]]=+r[c[0]];if(c[2]==='list')r[c[0]]=String(r[c[0]]||'').split(',').map(x=>x.trim()).filter(Boolean)});return r})}
function addSetting(){commitSettings();let spec=SETTINGS[currentSettings][1];if(spec===null)db.settings[currentSettings].push('New value');else if(spec==='object')db.settings[currentSettings]['New interlayer']={th:[0.76],gr:['Clear']};else if(spec==='pairs')db.settings[currentSettings].push(['new','New']);else if(spec==='constants')db.settings[currentSettings]['NEW_CONSTANT']=0;else{let o={};spec.forEach(c=>o[c[0]]=c[2]==='number'?0:c[2]==='list'?[]:'');db.settings[currentSettings].push(o)}mark();renderSettings()}
function deleteSettings(){commitSettings();let idx=[...document.querySelectorAll('#sbody tr')].map((tr,i)=>tr.querySelector('.spick')?.checked?i:-1).filter(i=>i>=0);if(!idx.length)return status('Select rows first.','bad');let spec=SETTINGS[currentSettings][1],set=new Set(idx);if(spec===null||Array.isArray(spec)||spec==='pairs')db.settings[currentSettings]=db.settings[currentSettings].filter((_,i)=>!set.has(i));else{let keys=Object.keys(db.settings[currentSettings]);idx.forEach(i=>delete db.settings[currentSettings][keys[i]])}mark();renderSettings()}
function applyRaw(){try{let x=JSON.parse(document.getElementById('raw').value);if(!x.items||!x.substrates||!x.coatings||!x.laminates||!x.settings)throw new Error('Full database sections are required');db=x;mark();renderAll();status('Raw JSON applied. Click Save changes.')}catch(e){status('Invalid JSON: '+e.message,'bad')}}
async function saveDb(){
  commitSettings();
  if(!currentSession)return status('Sign in before saving changes.','bad');
  if(!cloudLoaded||cloudVersion===null)return status('Shared database is not loaded. Click Reload cloud first.','bad');

  const nextDb=structuredClone(db);
  const now=new Date().toISOString();
  nextDb.version=(+nextDb.version||0)+1;
  nextDb.updatedAt=now;
  const nextCloudVersion=cloudVersion+1;

  try{
    const {data,error}=await cloud.from('app_data')
      .update({
        data:nextDb,
        version:nextCloudVersion,
        updated_at:now,
        updated_by:currentSession.user.id
      })
      .eq('id','catalog')
      .eq('version',cloudVersion)
      .select('version,updated_at')
      .maybeSingle();
    if(error)throw error;
    if(!data){
      status('Save conflict: another user changed the shared database. Reload cloud before saving again.','bad');
      return;
    }
    db=nextDb;
    cloudVersion=Number(data.version)||nextCloudVersion;
    cloudUpdatedAt=data.updated_at||now;
    dirty=false;
    document.title='IGU Full Database Admin';
    counts();
    status('Saved to shared Supabase database. Other computers will load version '+cloudVersion+'.');
  }catch(e){
    status('Cloud save failed: '+(e.message||e),'bad');
  }
}
function exportDb(){commitSettings();let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='igu-full-database-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importDb(inp){let f=inp.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.items||!x.substrates||!x.coatings||!x.laminates)throw new Error('Not a full IGU database');db=x;mark();renderAll();status('Imported. Click Save changes.')}catch(e){status(e.message,'bad')}inp.value=''};r.readAsText(f)}
async function resetDb(){
  if(dirty&&!confirm('Discard unsaved changes and reload the latest shared database?'))return;
  try{
    await loadCloudDb();
    dirty=false;
    document.title='IGU Full Database Admin';
    renderAll();
    status('Latest shared database loaded. Version '+cloudVersion+'.');
  }catch(e){
    status('Could not reload shared database: '+(e.message||e),'bad');
  }
}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});load().catch(e=>status(e.message,'bad'));
</script></body></html>
